name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri and USB build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # Private card fixtures require --features private-fixtures; the local
      # completion corpus requires explicit --ignored. Neither belongs in CI.
      - name: Test public Rust code
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  frontend:
    name: Frontend and coordinator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install frontend dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm ci
      - name: Frontend tests
        run: npm exec vitest run
      - name: Typecheck and production frontend build
        run: npm run build
      - name: Replay coordinator tests
        run: python3 -m unittest discover -s tools/ps1_replay -p 'test_*.py' -v
